<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; background: #070A0F; color: #F8FAFC; font-family: Inter, system-ui, sans-serif; }
      .wrap { padding: 16px; }
      .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; letter-spacing:-.02em; }
      .mark { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:#0D1117; border:1px solid #222B36; color:#22C55E; font-weight:900; }
      .row { display:flex; align-items:center; gap:8px; }
      .dot { width:8px; height:8px; border-radius:999px; background:#22C55E; box-shadow:0 0 14px rgba(34,197,94,.5); }
      .status { margin-top:14px; padding:11px 12px; background:#0D1117; border:1px solid #222B36; border-radius:12px; }
      .label { font-size:11px; color:#94A3B8; text-transform:uppercase; letter-spacing:.08em; }
      .value { margin-top:5px; font-size:12px; color:#F8FAFC; line-height:1.45; word-break:break-word; }
      p { font-size:12px; line-height:1.55; color:#94A3B8; margin:10px 0 0; }
      button { width:100%; margin-top:12px; border:1px solid #315e3d; background:#173320; color:#D9FFE4; border-radius:10px; height:36px; font-weight:700; cursor:pointer; }
      button:hover { background:#204329; }
      button.secondary { background:#0D1117; border-color:#222B36; color:#CBD5E1; }
      .ok { color:#22C55E; }
      .warn { color:#F59E0B; }
      .err { color:#EF4444; }
      .ver { font:11px 'JetBrains Mono', ui-monospace, monospace; color:#64748B; margin-top:12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="mark">O</span><span>Outpath Bridge</span></div>
      <div class="row" style="margin-top:12px"><span class="dot"></span><span style="font-size:12px">Bridge running</span></div>
      <p>Allows Outpath to send requests to your own localhost and permitted private development servers.</p>
      <div class="status">
        <div class="label">Pending local access</div>
        <div id="pending" class="value">None</div>
      </div>
      <button id="allow" hidden>Allow local access</button>
      <button id="refresh" class="secondary">Refresh status</button>
      <div id="message" class="value"></div>
      <div class="ver">v0.3.1</div>
    </div>
    <script>
      const pending = document.getElementById('pending')
      const allow = document.getElementById('allow')
      const refresh = document.getElementById('refresh')
      const message = document.getElementById('message')
      let currentOrigin = null

      function load() {
        chrome.runtime.sendMessage({ type: 'PERMISSION_STATUS' }, (response) => {
          if (chrome.runtime.lastError) {
            message.textContent = chrome.runtime.lastError.message
            message.className = 'value err'
            return
          }
          currentOrigin = response?.payload?.pendingOrigin || null
          pending.textContent = currentOrigin || 'None'
          allow.hidden = !currentOrigin
          message.textContent = currentOrigin ? 'Allow access here, then return to Outpath and press Send again.' : 'Ready for localhost requests.'
          message.className = 'value ' + (currentOrigin ? 'warn' : 'ok')
        })
      }

      allow.addEventListener('click', () => {
        if (!currentOrigin) return
        allow.disabled = true
        chrome.runtime.sendMessage({ type: 'REQUEST_PERMISSION', origin: currentOrigin }, (response) => {
          allow.disabled = false
          const result = response?.payload
          if (result?.granted) {
            message.textContent = 'Access granted. Return to Outpath and press Send again.'
            message.className = 'value ok'
            load()
          } else {
            message.textContent = result?.message || 'Permission was not granted.'
            message.className = 'value err'
          }
        })
      })

      refresh.addEventListener('click', load)
      load()
    </script>
  </body>
</html>
